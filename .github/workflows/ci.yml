name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build simulator and run tests (warnings are errors)
        run: make all CC=${{ matrix.cc }}
      - name: Run the simulation
        run: ./build/jacket_sim

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
